<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080"><g font-family="Yu Gothic,Meiryo,sans-serif"><rect width="1800" height="1080" fill="#f4f7fb"/><text x="48" y="55" font-size="23" fill="#52677e" font-weight="400">架空の家で試す CFD / 比較する条件</text><text x="48" y="120" font-size="43" fill="#142c46" font-weight="700">窓の位置を変えると、家の中の風通しはどう変わる？</text><text x="48" y="171" font-size="29" fill="#26364a" font-weight="400">外の風と窓の大きさをそろえ、2つ目の窓の位置だけを変えます。</text><rect x="40" y="210" width="840" height="740" rx="24" fill="white"/><text x="70" y="265" font-size="34" fill="#165e77" font-weight="700">A 向かい合う壁に窓</text><text x="150" y="314" font-size="25" fill="#26364a" font-weight="400">外の風：左から右へ 2 m/s</text><line x1="240" y1="335" x2="570" y2="335" stroke="#06a9cc" stroke-width="5"/><polygon points="590,335 566,322 566,348" fill="#06a9cc"/><rect x="130" y="360" width="600" height="450" fill="#faf8f1"/><line x1="130" y1="360" x2="130" y2="540" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="130" y1="630" x2="130" y2="810" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="130" y1="810" x2="730" y2="810" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="130" y1="540" x2="130" y2="630" stroke="#0bace0" stroke-width="17"/><line x1="130" y1="360" x2="730" y2="360" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="730" y1="360" x2="730" y2="540" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="730" y1="630" x2="730" y2="810" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="730" y1="540" x2="730" y2="630" stroke="#0bace0" stroke-width="17"/><text x="755" y="578" font-size="28" fill="#057ca1" font-weight="700">窓</text><text x="755" y="618" font-size="25" fill="#057ca1" font-weight="400">1.2m</text><text x="248" y="553" font-size="33" fill="#34475e" font-weight="700">架空のワンルーム</text><text x="340" y="608" font-size="32" fill="#26364a" font-weight="400">8m × 6m</text><text x="153" y="652" font-size="24" fill="#057ca1" font-weight="700">共通の窓 1.2m</text><line x1="130" y1="850" x2="730" y2="850" stroke="#8393a5" stroke-width="2"/><line x1="130" y1="840" x2="130" y2="860" stroke="#8393a5" stroke-width="2"/><line x1="730" y1="840" x2="730" y2="860" stroke="#8393a5" stroke-width="2"/><text x="408" y="889" font-size="27" fill="#52677e" font-weight="400">8m</text><text x="70" y="925" font-size="23" fill="#52677e" font-weight="400">青い部分が窓の開口。壁の厚さは0.2m。</text><rect x="920" y="210" width="840" height="740" rx="24" fill="white"/><text x="950" y="265" font-size="34" fill="#165e77" font-weight="700">B 隣り合う壁に窓</text><text x="1030" y="314" font-size="25" fill="#26364a" font-weight="400">外の風：左から右へ 2 m/s</text><line x1="1120" y1="335" x2="1450" y2="335" stroke="#06a9cc" stroke-width="5"/><polygon points="1470,335 1446,322 1446,348" fill="#06a9cc"/><rect x="1010" y="360" width="600" height="450" fill="#faf8f1"/><line x1="1010" y1="360" x2="1010" y2="540" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="1010" y1="630" x2="1010" y2="810" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="1010" y1="810" x2="1610" y2="810" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="1010" y1="540" x2="1010" y2="630" stroke="#0bace0" stroke-width="17"/><line x1="1010" y1="360" x2="1452.5" y2="360" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="1542.5" y1="360" x2="1610" y2="360" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="1610" y1="360" x2="1610" y2="810" stroke="#526477" stroke-width="15" stroke-linecap="butt"/><line x1="1452.5" y1="360" x2="1542.5" y2="360" stroke="#0bace0" stroke-width="17"/><text x="1423" y="326" font-size="25" fill="#057ca1" font-weight="700">窓 1.2m</text><text x="1128" y="553" font-size="33" fill="#34475e" font-weight="700">架空のワンルーム</text><text x="1220" y="608" font-size="32" fill="#26364a" font-weight="400">8m × 6m</text><text x="1033" y="652" font-size="24" fill="#057ca1" font-weight="700">共通の窓 1.2m</text><line x1="1010" y1="850" x2="1610" y2="850" stroke="#8393a5" stroke-width="2"/><line x1="1010" y1="840" x2="1010" y2="860" stroke="#8393a5" stroke-width="2"/><line x1="1610" y1="840" x2="1610" y2="860" stroke="#8393a5" stroke-width="2"/><text x="1288" y="889" font-size="27" fill="#52677e" font-weight="400">8m</text><text x="950" y="925" font-size="23" fill="#52677e" font-weight="400">青い部分が窓の開口。壁の厚さは0.2m。</text><text x="48" y="1010" font-size="25" fill="#52677e" font-weight="400">比較条件の説明図です。実際の風の経路・速さは、CFDの計算結果からアニメーションにします。</text></g></svg>